name: Post Scheduled Tweets

on:
  schedule:
    - cron: '0 * * * *'  # Run every hour at minute 0
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write  # Repository-level permission

jobs:
  post-tweets:
    runs-on: ubuntu-latest
    # No concurrency block - let each run complete independently
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}  # Explicit token for checkout
        fetch-depth: 0  # Full history to ensure clean commits
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install tweepy python-dotenv pytz
    
    - name: Create .env file
      run: |
        echo "X_API_KEY='${{ secrets.X_API_KEY }}'" > .env
        echo "X_API_SECRET='${{ secrets.X_API_SECRET }}'" >> .env
        echo "X_ACCESS_TOKEN='${{ secrets.X_ACCESS_TOKEN }}'" >> .env
        echo "X_ACCESS_TOKEN_SECRET='${{ secrets.X_ACCESS_TOKEN_SECRET }}'" >> .env
    
    - name: Configure Git
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
    
    - name: Run posting script
      run: python post_scheduled_tweet.py
      env:
        PYTHONUNBUFFERED: 1  # Ensure we see output immediately
    
    - name: Commit changes if any
      run: |
        if [[ -n $(git status -s) ]]; then
          git pull --rebase  # Ensure we have latest changes
          git add scheduled_posts.json
          git commit -m "Update scheduled posts [skip ci]"
          git push
        fi
