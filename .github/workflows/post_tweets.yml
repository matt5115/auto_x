name: Post Scheduled Tweets

on:
  schedule:
    - cron: '0 * * * *'  # Run every hour at minute 0
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write  # Repository-level permission

jobs:
  post-tweets:
    runs-on: ubuntu-latest
    timeout-minutes: 5  # Add timeout to prevent hanging
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0
        ref: main  # Explicitly set to main branch
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: List files
      run: ls -la  # Debug step to verify files
    
    - name: Verify secrets
      run: |
        if [ -z "${{ secrets.X_API_KEY }}" ] || \
           [ -z "${{ secrets.X_API_SECRET }}" ] || \
           [ -z "${{ secrets.X_ACCESS_TOKEN }}" ] || \
           [ -z "${{ secrets.X_ACCESS_TOKEN_SECRET }}" ]; then
          echo "Error: Missing required secrets"
          exit 1
        fi
        echo "All required secrets are set"
    
    - name: Create .env file
      run: |
        cat << EOF > .env
        X_API_KEY='${{ secrets.X_API_KEY }}'
        X_API_SECRET='${{ secrets.X_API_SECRET }}'
        X_ACCESS_TOKEN='${{ secrets.X_ACCESS_TOKEN }}'
        X_ACCESS_TOKEN_SECRET='${{ secrets.X_ACCESS_TOKEN_SECRET }}'
        EOF
        cat .env  # Debug step (will only show variable names, not values)
    
    - name: Configure Git
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
    
    - name: Run posting script
      run: python -u post_scheduled_tweet.py  # Added -u for unbuffered output
      env:
        PYTHONUNBUFFERED: 1
    
    - name: Commit changes if any
      run: |
        if [[ -n $(git status -s) ]]; then
          git pull --rebase
          git add scheduled_posts.json
          git commit -m "Update scheduled posts [skip ci]"
          git push
        fi
