name: Post Scheduled Tweets

on:
  schedule:
    - cron: '0 * * * *'  # Run every hour at minute 0
  workflow_dispatch:  # Allow manual trigger

concurrency:
  group: post-scheduled-tweets
  cancel-in-progress: true  # Changed to true to prevent overlapping runs

jobs:
  post-tweets:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3  # Updated to v3
      with:
        fetch-depth: 1  # Shallow clone
    
    - name: Set up Python
      uses: actions/setup-python@v4  # Updated to v4
      with:
        python-version: '3.11'
        cache: 'pip'  # Enable pip caching
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install tweepy python-dotenv pytz
    
    - name: Create .env file
      run: |
        echo "X_API_KEY=${{ secrets.X_API_KEY }}" >> .env
        echo "X_API_SECRET=${{ secrets.X_API_SECRET }}" >> .env
        echo "X_ACCESS_TOKEN=${{ secrets.X_ACCESS_TOKEN }}" >> .env
        echo "X_ACCESS_TOKEN_SECRET=${{ secrets.X_ACCESS_TOKEN_SECRET }}" >> .env
    
    - name: Run posting script
      run: |
        echo "Current directory contents:"
        ls -la
        echo "Content of scheduled_posts.json:"
        cat scheduled_posts.json
        python post_scheduled_tweet.py
